<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Automatización - Formación Profesional</title>
    <link rel="icon" href="https://i.postimg.cc/c4zrcgBD/Logo-2025-2.png" type="image/png">
    
    <!-- LIBRERÍAS Y FUENTES -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* ==========================================
           VARIABLES Y ESTILOS BASE - MODERNO
           ========================================== */
        :root {
            --bg-default: #f7f9fb;
            --bg-secondary: rgba(255, 255, 255, 0.85);
            --bg-dark: #0a0f1e;
            --bg-dark-accent: rgba(30, 41, 59, 0.6);
            --text-default: #0f172a;
            --text-secondary: #64748b;
            --text-light: #f8fafc;
            --text-accent: #06b6d4;
            --border-default: rgba(255, 255, 255, 0.18);
            --border-light: rgba(255, 255, 255, 0.12);
            --shadow-color: rgba(0, 0, 0, 0.08);
            --badge-bg-basic: #06b6d4;
            --badge-bg-intermediate: #8b5cf6;
            --badge-bg-advanced: #f59e0b;
            --badge-text: #ffffff;
            --cyan-glow: 0 4px 16px rgba(6, 182, 212, 0.2), 0 0 24px rgba(6, 182, 212, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-blur: 12px;
        }

        body:not(.light-mode) {
            --bg-default: #0a0f1e;
            --bg-secondary: rgba(30, 41, 59, 0.5);
            --text-default: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-light: #f8fafc;
            --border-default: rgba(255, 255, 255, 0.08);
            --border-light: rgba(6, 182, 212, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --cyan-glow: 0 4px 16px rgba(6, 182, 212, 0.25), 0 0 24px rgba(6, 182, 212, 0.1);
            --glass-bg: rgba(15, 23, 42, 0.82);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0f1e;
            background-image: url('img/fondo2.webp');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            color: var(--text-default);
            scroll-behavior: smooth;
            overflow-x: clip;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* AURORA BACKGROUND EFFECT */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse 50% 50% at 50% 100%, rgba(6, 182, 212, 0.04) 0%, transparent 50%),
                linear-gradient(180deg, rgba(10, 15, 30, 0.98) 0%, rgba(15, 23, 42, 0.97) 50%, rgba(10, 15, 30, 0.98) 100%);
            z-index: 0;
            pointer-events: none;
        }

        body:not(.light-mode)::before {
            animation: auroraShift 20s ease-in-out infinite;
        }

        @keyframes auroraShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.92; }
        }

        body.light-mode {
            background-color: #d0e1ef;
            background-image: url('img/fondo2.webp');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        body.light-mode::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(208, 225, 239, 0.95) 0%,
                rgba(208, 225, 239, 0.92) 40%,
                rgba(208, 225, 239, 0.88) 100%
            );
            backdrop-filter: blur(1px) saturate(105%);
            -webkit-backdrop-filter: blur(1px) saturate(105%);
            z-index: 0;
            pointer-events: none;
            animation: none !important;
        }

        /* GRADIENT TEXT UTILITY */
        .gradient-text {
            background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: gradientFlow 8s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .section-title { 
            color: var(--text-default); 
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .section-title span {
            background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-subtitle {
            color: var(--text-accent);
            letter-spacing: 0.15em;
            font-weight: 800;
        }

        body.light-mode .hero-main-title { color: #000000 !important; }
        body.light-mode .hero-main-title .text-secondary {
            background: linear-gradient(135deg, #0891b2 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        body.light-mode header .hero-main-title {
            color: #ffffff !important;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 40px rgba(6, 182, 212, 0.15) !important;
        }
        body.light-mode header .hero-main-title .text-secondary {
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 50%, #8b5cf6 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientFlow 6s ease infinite;
            filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.4));
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { 
            background: rgba(255, 255, 255, 0.03); 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, #06b6d4, #8b5cf6); 
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #22d3ee, #a78bfa);
        }

        .particles-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(6, 182, 212, 0.3);
            border-radius: 50%;
            animation: float-particle 20s infinite ease-in-out;
        }
        @keyframes float-particle {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        #page-home, main, header, section, footer {
            position: relative;
            z-index: 1;
        }

        header {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(10px) saturate(140%) !important;
            -webkit-backdrop-filter: blur(10px) saturate(140%) !important;
            border-bottom: 1px solid var(--glass-border) !important;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1) !important;
        }

        header .absolute.inset-0 {
            opacity: 0.3 !important;
            filter: saturate(1.2) contrast(1.1);
        }

        header .hero-main-title {
            color: #ffffff !important;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 40px rgba(6, 182, 212, 0.15) !important;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        header .hero-main-title .text-secondary {
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none !important;
            filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.4));
        }

        header p {
            color: rgba(255, 255, 255, 0.85) !important;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3) !important;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        /* ==========================================
           TOAST DE CARGA - RESPONSIVE MEJORADO
           ========================================== */
        .loading-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100002;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.96) 0%, rgba(30, 41, 59, 0.96) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(45, 184, 206, 0.35);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35), 0 0 12px rgba(45, 184, 206, 0.15);
            pointer-events: none;
            min-width: 200px;
            max-width: 240px;
            animation: slideInRight 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .loading-toast.hiding {
            opacity: 0;
            transform: translateX(120px);
        }
        .loading-toast .toast-logo {
            width: 25px;
            height: 25px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulseLogo 2.5s infinite ease-in-out;
        }
        .loading-toast .toast-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 4px rgba(45, 184, 206, 0.4));
        }
        .loading-toast .toast-content {
            flex: 1;
            min-width: 0;
        }
        .loading-toast .toast-title {
            color: #ffffff;
            font-weight: 700;
            font-size: 10px;
            line-height: 1.3;
            letter-spacing: 0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }
        .loading-toast .toast-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(45, 184, 206, 0.2);
            border-top: 2px solid #2db8ce;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            flex-shrink: 0;
        }
        .loading-toast.success-toast {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.96) 0%, rgba(5, 150, 105, 0.96) 100%);
            border: 1px solid rgba(16, 185, 129, 0.7);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3), 0 0 14px rgba(16, 185, 129, 0.35);
        }
        .loading-toast.success-toast .toast-title {
            color: #ffffff;
        }
        .loading-toast.success-toast .toast-check {
            width: 20px;
            height: 20px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .loading-toast.success-toast .toast-check i {
            color: #10b981;
            font-size: 10px;
            font-weight: 900;
        }

        /* MODO CLARO - TOAST */
        body.light-mode .loading-toast {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(248, 250, 252, 0.98) 100%);
            border: 1px solid rgba(45, 184, 206, 0.5);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12), 0 0 10px rgba(45, 184, 206, 0.2);
        }
        body.light-mode .loading-toast .toast-title {
            color: #1e293b;
        }
        body.light-mode .loading-toast.success-toast {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.98) 0%, rgba(5, 150, 105, 0.98) 100%);
            border: 1px solid rgba(16, 185, 129, 0.7);
        }
        body.light-mode .loading-toast.success-toast .toast-title {
            color: #ffffff;
        }

        /* RESPONSIVE - MÓVIL (CLAVE DEL DISEÑO) */
        @media (max-width: 640px) {
            .loading-toast {
                bottom: 16px;
                right: 16px;
                left: 16px;
                min-width: auto;
                max-width: none;
                padding: 10px 14px;
                border-radius: 14px;
            }
            .loading-toast .toast-logo {
                width: 28px;
                height: 28px;
            }
            .loading-toast .toast-title {
                font-size: 11px;
                max-width: none;
                flex: 1;
            }
            .loading-toast .toast-spinner {
                width: 16px;
                height: 16px;
            }
            .loading-toast.success-toast .toast-check {
                width: 24px;
                height: 24px;
            }
        }

        /* TABLETS PEQUEÑAS */
        @media (min-width: 641px) and (max-width: 768px) {
            .loading-toast {
                bottom: 20px;
                right: 20px;
                left: auto;
                min-width: 220px;
                max-width: 280px;
            }
        }

        @keyframes slideInRight {
            from { transform: translateX(150%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideInUp {
            from { transform: translateY(150%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulseLogo {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(45, 184, 206, 0.25)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 12px rgba(45, 184, 206, 0.55)); transform: scale(1.06); }
        }
        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* ==========================================
           BOTÓN WHATSAPP FLOTANTE
           ========================================== */
        .whatsapp-float {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 26px;
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.35), 0 0 0 1px rgba(255,255,255,0.1);
            z-index: 99998;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            text-decoration: none;
            border: none;
            cursor: pointer;
        }
        .whatsapp-float:hover {
            transform: scale(1.12) translateY(-3px);
            box-shadow: 0 8px 28px rgba(37, 211, 102, 0.5);
        }
        .whatsapp-float::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 2px solid rgba(37, 211, 102, 0.35);
            animation: whatsappPulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes whatsappPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0; }
        }
        .whatsapp-float::after {
            content: '¿Dudas? Escríbenos';
            position: absolute;
            right: calc(100% + 12px);
            top: 50%;
            transform: translateY(-50%) scale(0.9);
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            letter-spacing: 0.02em;
        }
        .whatsapp-float:hover::after {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }
        body.light-mode .whatsapp-float::after {
            background: rgba(255, 255, 255, 0.95);
            color: #0f172a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        @media (max-width: 768px) {
            .whatsapp-float {
                width: 48px;
                height: 48px;
                font-size: 24px;
                bottom: 16px;
                right: 16px;
            }
            .whatsapp-float::after { display: none; }
        }

        /* ==========================================
           RESPONSIVE GENERAL
           ========================================== */
        @media (max-width: 768px) {
            header .relative.z-10 { padding-top: 6rem !important; padding-bottom: 3rem !important; }
            .hero-main-title { font-size: 1.75rem !important; line-height: 1.15 !important; }
            .section-title { font-size: 1.5rem !important; }
            .section-subtitle { font-size: 0.6rem !important; letter-spacing: 0.2em !important; }
            .particles-bg { display: none; }
            header img[alt="Icono"] { height: 10rem !important; }
        }
    </style>

</head>
<body class="custom-scrollbar">
<!-- TOAST DE CARGA -->
<div id="loadingToast" class="loading-toast hidden">
    <div class="toast-logo">
        <img src="img/AA (38).webp" alt="Aprende Automatización" onerror="this.style.display='none'">
    </div>
    <div class="toast-content flex-1">
        <div class="toast-title" id="loadingToastTitle">Estamos cargando la información</div>
    </div>
    <div class="toast-spinner" id="loadingToastSpinner"></div>
</div>

<script>
    // ============ FUNCIONES DEL TOAST DE CARGA ============
    function showLoadingToast() {
        const toast = document.getElementById('loadingToast');
        const title = document.getElementById('loadingToastTitle');
        const spinner = document.getElementById('loadingToastSpinner');
        
        if (toast) {
            toast.classList.remove('hidden', 'hiding', 'success-toast');
            title.innerText = 'Estamos cargando la información';
            if (spinner) spinner.style.display = 'block';
            const existingCheck = toast.querySelector('.toast-check');
            if (existingCheck) existingCheck.remove();
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(0)';
            // Animación según dispositivo
            if (window.innerWidth <= 640) {
                toast.style.animation = 'slideInUp 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            } else {
                toast.style.animation = 'slideInRight 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            }
        }
    }

    function showSuccessToast() {
        const toast = document.getElementById('loadingToast');
        const title = document.getElementById('loadingToastTitle');
        const spinner = document.getElementById('loadingToastSpinner');
        
        if (toast) {
            toast.classList.remove('hidden', 'hiding');
            toast.classList.add('success-toast');
            title.innerText = '¡Listo!';
            if (spinner) spinner.style.display = 'none';
            const existingCheck = toast.querySelector('.toast-check');
            if (existingCheck) existingCheck.remove();
            const checkDiv = document.createElement('div');
            checkDiv.className = 'toast-check';
            checkDiv.innerHTML = '<i class="fas fa-check"></i>';
            toast.appendChild(checkDiv);
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(0)';
            // Animación según dispositivo
            if (window.innerWidth <= 640) {
                toast.style.animation = 'slideInUp 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            } else {
                toast.style.animation = 'slideInRight 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            }
            setTimeout(() => { hideLoadingToast(); }, 3000);
        }
    }

    function hideLoadingToast() {
        const toast = document.getElementById('loadingToast');
        if (toast) {
            toast.classList.add('hiding');
            // Animación de salida según dispositivo
            if (window.innerWidth <= 640) {
                toast.style.transform = 'translateY(150%)';
            } else {
                toast.style.transform = 'translateX(120px)';
            }
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('hiding', 'success-toast');
                toast.style.transform = '';
            }, 350);
        }
    }
    // ============ FIN FUNCIONES DEL TOAST ============
</script>
