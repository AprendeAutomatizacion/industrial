<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Automatización - Mis Cursos</title>
    <link rel="icon" href="https://i.postimg.cc/c4zrcgBD/Logo-2025-2.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1877f2',
                        secondary: '#2db8ce',
                        dark: '#0f172a',
                        accent: '#91a1af',
                        light: '#f8fafc',
                    }
                }
            }
        }
    </script>
    <style>
        /* PREVENIR FLASH BLANCO EN CARGA */
        html { background-color: #0a0f1e; }
        html.light-mode { background-color: #d0e1ef; }

        /* ==========================================
           VARIABLES Y ESTILOS BASE - MODERNO
           ========================================== */
        :root {
            --bg-default: #f7f9fb;
            --bg-secondary: rgba(255, 255, 255, 0.85);
            --bg-dark: #0a0f1e;
            --bg-dark-accent: rgba(30, 41, 59, 0.6);
            --text-default: #0f172a;
            --text-secondary: #64748b;
            --text-light: #f8fafc;
            --text-accent: #06b6d4;
            --border-default: rgba(255, 255, 255, 0.18);
            --border-light: rgba(255, 255, 255, 0.12);
            --shadow-color: rgba(0, 0, 0, 0.08);
            --badge-bg-basic: #06b6d4;
            --badge-bg-intermediate: #8b5cf6;
            --badge-bg-advanced: #f59e0b;
            --badge-text: #ffffff;
            --cyan-glow: 0 8px 32px rgba(6, 182, 212, 0.35), 0 0 60px rgba(6, 182, 212, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-blur: 20px;
        }

        body:not(.light-mode) {
            --bg-default: #0a0f1e;
            --bg-secondary: rgba(30, 41, 59, 0.5);
            --text-default: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-light: #f8fafc;
            --border-default: rgba(255, 255, 255, 0.08);
            --border-light: rgba(6, 182, 212, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --cyan-glow: 0 8px 32px rgba(6, 182, 212, 0.45), 0 0 60px rgba(6, 182, 212, 0.2);
            --glass-bg: rgba(15, 23, 42, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0f1e;
            background-image: url('img/fondo2.webp');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
            color: var(--text-default);
            scroll-behavior: smooth;
            overflow-x: clip;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* AURORA BACKGROUND EFFECT */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 80% 50% at 20% 40%, rgba(6, 182, 212, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 80% 60%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 50% 50% at 50% 100%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
                linear-gradient(180deg, rgba(10, 15, 30, 0.96) 0%, rgba(15, 23, 42, 0.94) 50%, rgba(10, 15, 30, 0.96) 100%);
            z-index: 0;
            pointer-events: none;
        }

        body:not(.light-mode)::before {
            animation: auroraShift 20s ease-in-out infinite;
        }

        @keyframes auroraShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        body.light-mode {
            background-color: #d0e1ef;
            background-image: url('img/fondo2.webp');
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        body.light-mode::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(
                180deg,
                rgba(208, 225, 239, 0.78) 0%,
                rgba(208, 225, 239, 0.72) 40%,
                rgba(208, 225, 239, 0.68) 100%
            );
            backdrop-filter: blur(2px) saturate(110%);
            -webkit-backdrop-filter: blur(2px) saturate(110%);
            z-index: 0;
            pointer-events: none;
            animation: none !important;
        }

        /* GRADIENT TEXT UTILITY */
        .gradient-text {
            background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: gradientFlow 6s ease infinite;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .section-title { 
            color: var(--text-default); 
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .section-title span {
            background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-subtitle {
            color: var(--text-accent);
            letter-spacing: 0.15em;
            font-weight: 800;
        }

        body.light-mode .hero-main-title { color: #000000 !important; }
        body.light-mode .hero-main-title .text-secondary {
            background: linear-gradient(135deg, #0891b2 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* SCROLLBAR PREMIUM */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { 
            background: rgba(255, 255, 255, 0.03); 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, #06b6d4, #8b5cf6); 
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #22d3ee, #a78bfa);
        }

        /* FLOATING PARTICLES BACKGROUND */
        .particles-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(6, 182, 212, 0.3);
            border-radius: 50%;
            animation: float-particle 20s infinite ease-in-out;
        }
        @keyframes float-particle {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        #page-mis-cursos, #page-curso-detalle, main, header, section, footer {
            position: relative;
            z-index: 1;
        }

        /* ==========================================
           HEADER - GLASSMORPHISM PREMIUM
           ========================================== */
        header {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(var(--glass-blur)) saturate(180%) !important;
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%) !important;
            border-bottom: 1px solid var(--glass-border) !important;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1) !important;
        }

        header .absolute.inset-0 {
            opacity: 0.3 !important;
            filter: saturate(1.2) contrast(1.1);
        }

        header .hero-main-title {
            color: #ffffff !important;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), 0 0 40px rgba(6, 182, 212, 0.15) !important;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        header .hero-main-title .text-secondary {
            background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none !important;
            filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.4));
        }

        header p {
            color: rgba(255, 255, 255, 0.85) !important;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3) !important;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        header .bg-blue-500\/20,
        header .bg-red-500\/20,
        header .bg-emerald-500\/20 {
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        header .bg-blue-500\/20:hover,
        header .bg-red-500\/20:hover,
        header .bg-emerald-500\/20:hover {
            transform: translateY(-1px);
        }

        /* ==========================================
           TARJETAS DE CURSO - GLASSMORPHISM 3D
           ========================================== */
        .course-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 2rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-align: left;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            position: relative;
        }
        .course-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 2rem;
            padding: 1.5px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.3), rgba(139, 92, 246, 0.1), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .course-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 40px rgba(6, 182, 212, 0.15);
            border-color: rgba(6, 182, 212, 0.4);
            z-index: 10;
        }
        .course-card:hover::before {
            opacity: 1;
        }
        .course-card .course-card-image-container {
            position: relative;
            height: 12rem;
            overflow: hidden;
        }
        .course-card .course-card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .course-card:hover .course-card-image {
            transform: scale(1.05);
        }
        .course-card .course-card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .course-card .course-card-badge {
            padding: 0.25rem 0.75rem;
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 9999px;
            color: var(--badge-text);
            white-space: nowrap;
        }
        .badge-container {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .badge-generic {
            background-color: #475569;
        }
        .course-card .badge-intermediate { background-color: var(--badge-bg-intermediate); }
        .course-card .badge-basic { background-color: var(--badge-bg-basic); }
        .course-card .badge-avanzado { background-color: var(--badge-bg-advanced); }
        .course-card .course-card-title {
            color: var(--text-default);
            font-size: 1.125rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 0.5rem;
        }
        .course-card .course-card-description {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            flex-grow: 1;
            line-height: 1.6;
        }
        .course-card .course-card-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border-default);
        }
        .course-card .course-card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .course-card .course-card-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-default);
        }
        .course-card .course-card-stats {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .course-card .like-btn, .course-card .view-container {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }
        .course-card .like-btn:hover { color: #ef4444; }
        .course-card .like-btn.liked,
        .course-card .like-btn.liked i { color: #ef4444 !important; }
        .course-card .view-container.has-views { color: #22c55e; }
        .course-card .course-card-buttons { display: flex; gap: 0.75rem; }

        .course-card-level-basico {
            border: 2px solid rgba(6, 182, 212, 0.7);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.25), 
                        inset 0 0 60px rgba(6, 182, 212, 0.08);
            background: linear-gradient(180deg, rgba(6, 182, 212, 0.08) 0%, rgba(8, 12, 33, 0.4) 100%);
        }
        .course-card-level-basico:hover {
            border: 2.5px solid rgba(6, 182, 212, 1);
            box-shadow: 0 0 50px rgba(6, 182, 212, 0.5), 
                        0 12px 40px rgba(6, 182, 212, 0.3), 
                        inset 0 0 80px rgba(6, 182, 212, 0.12);
            background: linear-gradient(180deg, rgba(6, 182, 212, 0.15) 0%, rgba(8, 12, 33, 0.5) 100%);
        }
        .course-card-level-intermedio {
            border: 2px solid rgba(139, 92, 246, 0.7);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.25), 
                        inset 0 0 60px rgba(139, 92, 246, 0.08);
            background: linear-gradient(180deg, rgba(139, 92, 246, 0.08) 0%, rgba(8, 12, 33, 0.4) 100%);
        }
        .course-card-level-intermedio:hover {
            border: 2.5px solid rgba(139, 92, 246, 1);
            box-shadow: 0 0 50px rgba(139, 92, 246, 0.5), 
                        0 12px 40px rgba(139, 92, 246, 0.3), 
                        inset 0 0 80px rgba(139, 92, 246, 0.12);
            background: linear-gradient(180deg, rgba(139, 92, 246, 0.15) 0%, rgba(8, 12, 33, 0.5) 100%);
        }
        .course-card-level-avanzado {
            border: 2px solid rgba(245, 158, 11, 0.7);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.25), 
                        inset 0 0 60px rgba(245, 158, 11, 0.08);
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.08) 0%, rgba(8, 12, 33, 0.4) 100%);
        }
        .course-card-level-avanzado:hover {
            border: 2.5px solid rgba(245, 158, 11, 1);
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.5), 
                        0 12px 40px rgba(245, 158, 11, 0.3), 
                        inset 0 0 80px rgba(245, 158, 11, 0.12);
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.15) 0%, rgba(8, 12, 33, 0.5) 100%);
        }

        /* Progress bar dentro de tarjetas */
        .course-card .progress-container {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1rem;
        }
        html.light-mode body .course-card .progress-container,
        body.light-mode .course-card .progress-container {
            background: #d0e1ef !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: 1px solid #b8d4e3 !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        html.light-mode body .course-card .progress-container .text-white,
        body.light-mode .course-card .progress-container .text-white,
        html.light-mode body .course-card .progress-container [class*="text-white"],
        body.light-mode .course-card .progress-container [class*="text-white"] {
            color: #1e293b !important;
        }
        html.light-mode body .course-card .progress-container .text-green-400,
        body.light-mode .course-card .progress-container .text-green-400 {
            color: #059669 !important;
        }
        html.light-mode body .course-card .progress-container .bg-white\/10,
        body.light-mode .course-card .progress-container .bg-white\/10 {
            background: #e2e8f0 !important;
        }
        html.light-mode body .course-card .progress-container .bg-green-400,
        body.light-mode .course-card .progress-container .bg-green-400 {
            background: #10b981 !important;
        }
        /* Barra de progreso en tarjetas de curso - modo claro */
        html.light-mode body .course-card [class*="bg-[#0f172a]"],
        body.light-mode .course-card [class*="bg-[#0f172a]"] {
            background: #d0e1ef !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border-color: #b8d4e3 !important;
        }
        html.light-mode body .course-card [class*="bg-[#0f172a]"] .text-white,
        body.light-mode .course-card [class*="bg-[#0f172a]"] .text-white {
            color: #1e293b !important;
        }
        html.light-mode body .course-card [class*="bg-[#0f172a]"] [class*="bg-white/10"],
        body.light-mode .course-card [class*="bg-[#0f172a]"] [class*="bg-white/10"] {
            background: #e2e8f0 !important;
        }

        /* ==========================================
           TARJETA DE ESTUDIANTE - GLASSMORPHISM
           ========================================== */
        .student-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }
        .student-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.08) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .student-card:hover {
            transform: translateY(-4px);
            border-color: rgba(6, 182, 212, 0.3);
            box-shadow: var(--cyan-glow), 0 20px 60px rgba(0, 0, 0, 0.15);
        }
        .student-card:hover::before {
            opacity: 1;
        }

        body:not(.light-mode) .student-card h2,
        body:not(.light-mode) .student-card h3,
        body:not(.light-mode) .student-card p { color: #f1f5f9; }
        body:not(.light-mode) .student-card .text-slate-300 { color: #cbd5e1; }
        body:not(.light-mode) .student-card .text-slate-400 { color: #94a3b8; }

        /* Glassmorphism para la tarjeta en modo oscuro */
        body:not(.light-mode) .student-card-inner {
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Fondo sólido blanco para la tarjeta en modo claro */
        html.light-mode body .student-card-inner,
        body.light-mode .student-card-inner {
            background-color: #ffffff !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: 1px solid #e2e8f0 !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        html.light-mode body .student-card,
        html.light-mode body #misCursosUserInfo .student-card,
        body.light-mode .student-card,
        body.light-mode #misCursosUserInfo .student-card {
            background: #ffffff !important;
            background-color: #ffffff !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border-color: #e2e8f0 !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06) !important;
        }
        html.light-mode body .student-card::before,
        body.light-mode .student-card::before {
            display: none !important;
            opacity: 0 !important;
            background: none !important;
        }
        html.light-mode body .student-card h2,
        html.light-mode body .student-card h3,
        body.light-mode .student-card h2,
        body.light-mode .student-card h3 { color: #1e293b !important; }
        html.light-mode body .student-card p,
        body.light-mode .student-card p { color: #475569 !important; }
        html.light-mode body .student-card .text-white,
        body.light-mode .student-card .text-white { color: #1e293b !important; }
        html.light-mode body .student-card .text-slate-300,
        body.light-mode .student-card .text-slate-300 { color: #64748b !important; }
        html.light-mode body .student-card .text-slate-400,
        body.light-mode .student-card .text-slate-400 { color: #94a3b8 !important; }
        html.light-mode body .student-card .text-white\/5,
        body.light-mode .student-card .text-white\/5 { color: #d0e1ef !important; }
        html.light-mode body .student-card .fa-id-card,
        body.light-mode .student-card .fa-id-card {
            background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%) !important;
            -webkit-background-clip: text !important;
            -webkit-text-fill-color: transparent !important;
            background-clip: text !important;
            color: transparent !important;
        }

        /* ==========================================
           BOTONES - GLOW GRADIENT PREMIUM
           ========================================== */
        .btn-metal-solid {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            padding: 1rem 2rem;
            border-radius: 1.25rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;

        /* ==========================================
           TOAST DE CARGA - GLASSMORPHISM PREMIUM
           ========================================== */

            align-items: center;
            gap: 12px;

            pointer-events: none;
            min-width: 240px;
            max-width: 280px;
            animation: slideInRight 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .loading-toast.hiding { 
            opacity: 0; 
            transform: translateX(120px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .loading-toast .toast-logo {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            animation: pulseLogo 2s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.4));
        }
        .loading-toast .toast-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .loading-toast .toast-title {
            color: #ffffff;
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 0;
            line-height: 1.3;
            letter-spacing: 0.02em;
        }
        .loading-toast .toast-spinner {
            width: 16px;
            height: 16px;
            border: 2.5px solid rgba(6, 182, 212, 0.15);
            border-top: 2.5px solid #06b6d4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
            filter: drop-shadow(0 0 4px rgba(6, 182, 212, 0.4));
        }
        .loading-toast.success-toast {
            background: rgba(16, 185, 129, 0.9);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.2);
        }
        @keyframes slideInRight {
            from { transform: translateX(150%) scale(0.9); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.3)); }

        function parseProgressString(raw,totalLessons){
            if(!raw||raw.trim()==="") return {completed:0,total:totalLessons,percent:0,scores:[],avgScore:0};
            let safe=String(raw).trim().replace(/'/g,'"');
            let scores=new Array(totalLessons).fill(null);
            let completed=0;
            try{
                const p=JSON.parse(safe);
                if(p&&typeof p==='object'){
                    if(p.progress&&Array.isArray(p.progress)) completed=p.progress.length;
                    else if(typeof p.completed==='number') completed=p.completed;
                    const src=p.scores||p;
                    if(Array.isArray(src)){ for(let i=0;i<src.length&&i<totalLessons;i++) scores[i]=Number(src[i]); }
                    else if(typeof src==='object'){ for(let k in src){ let idx=parseInt(k); if(!isNaN(idx)&&idx>=0&&idx<totalLessons) scores[idx]=Number(src[k]); } }
                }
            }catch(e){
                if(safe.includes(',')){ let parts=safe.split(','); parts.forEach((p,i)=>{ if(i<totalLessons) scores[i]=Number(p.trim()); }); }
                else { let n=parseFloat(safe); if(!isNaN(n)){ if(safe.includes('%')||n<=100) completed=Math.round((n/100)*totalLessons); else completed=n; scores[0]=n; } }
            }
            let valid=scores.filter(n=>n!==null&&!isNaN(n));
            if(completed===0&&valid.length>0) completed=valid.length;
            completed=Math.min(Math.max(0,completed),totalLessons);
            const avg=valid.length>0?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length):0;
            let percent=totalLessons>0?Math.round((completed/totalLessons)*100):0;
            return {completed,total:totalLessons,percent,scores,avgScore:avg};
        }

        function normalizeDateString(raw) { if (!raw || raw === "") return ""; let str = String(raw).trim(); if (str.includes("T")) str = str.split("T")[0]; else str = str.split(" ")[0]; if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str; const parts = str.split(/[/\-.]/); if (parts.length === 3) { let day = parseInt(parts[0], 10); let month = parseInt(parts[1], 10); let year = parseInt(parts[2], 10); if (parts[0].length === 4) { year = parseInt(parts[0], 10); day = parseInt(parts[2], 10); } if (!isNaN(day) && !isNaN(month) && !isNaN(year)) { const y = year < 100 ? 2000 + year : year; return `${y}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`; } } const num = Number(str); if (!isNaN(num) && num > 0) { const d = new Date(num > 1e12 ? num : num * 1000); if (!isNaN(d.getTime())) return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); } const d = new Date(raw); if (!isNaN(d.getTime())) return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); return raw; }
        function extractDateOnly(rawStr) { if (!rawStr || String(rawStr).trim() === "") return null; let str = String(rawStr).trim(); if (str.includes('T')) return str.split('T')[0]; return str.split(' ')[0]; }
        function formatCertDate(dateStr) { if (!dateStr) return "[En proceso de registro en sistema]"; if (dateStr.includes("T")) dateStr = dateStr.split("T")[0]; let parts = dateStr.split(/[/\-]/); if (parts.length === 3) { let d = parseInt(parts[0], 10); let m = parseInt(parts[1], 10); let y = parseInt(parts[2], 10); if (parts[0].length === 4) { y = parseInt(parts[0], 10); d = parseInt(parts[2], 10); } if (y < 100) y += 2000; const monthNames = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"]; let mIndex = m - 1; if(mIndex >= 0 && mIndex < 12 && !isNaN(d) && !isNaN(y)) return `${d} de ${monthNames[mIndex]} de ${y}`; } return dateStr; }
        function findDateInObject(normalizedObj, courseName) { if (!normalizedObj || !courseName) return null; const normCourse = normalizeName(courseName); for (let key in normalizedObj) if (normalizeName(key) === normCourse) return normalizedObj[key]; return null; }

        async function loadData(){
            try{
                const res=await fetch(`${SCRIPT_URL}?action=get_data&t=${Date.now()}`);
                const data=await res.json();
                if(data.status==='success'){
                    dbUsers=data.users||{}; 
                    globalStats=data.stats||{}; 
                    dbUserCourses=data.userCourses||{}; 
                    dbUserDetails=data.userDetails||{}; 
                    dbUserProgress=data.userProgress||{};
                    
                    let enrollmentDatesBackend = data.userCourseEnrollmentDates || {};
                    let completionDatesBackend = data.userCourseCompletionDates || {};
                    
                    calculateCourseRatings(); 
                    updateStudentCounts();
                    
                    // ========== SINCRONIZAR CURSOS DEL USUARIO ==========
                    if(window.currentUser && window.currentUser.email){
                        const email = window.currentUser.email.toLowerCase();
                        
                        let myCourseNamesRaw = dbUserCourses[email] || [];
                        let myCourseNames = splitCourseNames(myCourseNamesRaw);
                        
                        console.log('📋 Cursos encontrados en Mis Cursos para', email, ':', myCourseNames);
                        
                        let myCourseIds = [];
                        myCourseNames.forEach(cName => {
                            let nn = normalizeName(cName);
                            let found = COURSES_DATA.find(x => normalizeName(x.Nombre) === nn);
                            if(!found) found = COURSES_DATA.find(x => normalizeName(x.Nombre).includes(nn) || nn.includes(normalizeName(x.Nombre)));
                            if(found) {
                                myCourseIds.push(found.ID);
                                console.log('  ✅ Curso encontrado:', cName, '-> ID:', found.ID);
                            }
                        });
                        
                        let globalUser = dbUsers[email] || {};
                        if(typeof globalUser === 'string'){ 
                            try{ globalUser = JSON.parse(globalUser); } catch(e) { globalUser = {}; } 
                        }
                        
                        let details = dbUserDetails[email] || {};
                        
                        let existingIds = Array.isArray(globalUser.accessedCursos) ? globalUser.accessedCursos : (window.currentUser.accessedCursos || []);
                        window.currentUser.accessedCursos = [...new Set([...existingIds, ...myCourseIds])];
                        
                        if(details.name && details.name !== "No provisto" && details.name !== "N/A") 
                            window.currentUser.name = details.name;
                        window.currentUser.cedula = details.cedula || window.currentUser.cedula || "N/A";
                        window.currentUser.telefono = details.telefono || window.currentUser.telefono || "N/A";
                        window.currentUser.pais = details.pais || window.currentUser.pais || "N/A";
                        window.currentUser.estado = details.estado || window.currentUser.estado || "N/A";
                        window.currentUser.downloadedFiles = globalUser.downloadedFiles || window.currentUser.downloadedFiles || [];
                        window.currentUser.ratings = globalUser.ratings || window.currentUser.ratings || {};
                        window.currentUser.profession = globalUser.profession || window.currentUser.profession || "";
                        window.currentUser.likedCourses = globalUser.likedCourses || window.currentUser.likedCourses || [];
                        window.currentUser.visitRegistro = globalUser.visitRegistro || window.currentUser.visitRegistro || {
                            cursos: {},
                            infoPaginas: {},
                            aulas: {}
                        };
                        
                        const backendDatesForEmail = enrollmentDatesBackend[email] || {};
                        const backendCompDatesForEmail = completionDatesBackend[email] || {};
                        latestEnrollmentDates = backendDatesForEmail;
                        latestCompletionDates = backendCompDatesForEmail;
                        
                        localStorage.setItem('user', JSON.stringify(window.currentUser));
                        
                        updateAllUI(); 
                        fetchProgressForAllCourses(); 
                        renderMisCourses();
                    } else {
                        renderMisCourses();
                    }
                }
            } catch(e){ 
                console.error("Error al cargar la data global:", e); 
                if(window.currentUser) {
                    renderMisCourses();
                }
            }
        }

        async function silentRefreshData(){
            if(!window.currentUser) return;
            
            // Mostrar toast de carga para la actualización silenciosa
            showLoadingToast();
            
            try{
                const res=await fetch(`${SCRIPT_URL}?action=get_data&t=${Date.now()}`);
                const data=await res.json();
                if(data.status==='success'){
                    dbUserProgress=data.userProgress||{};
                    globalStats=data.stats||{};
                    let enrollmentDatesBackend = data.userCourseEnrollmentDates || {};
                    let completionDatesBackend = data.userCourseCompletionDates || {};
                    if (window.currentUser.email) {
                        const emailKey = currentUser.email.toLowerCase();
                        const backendDatesForEmail = enrollmentDatesBackend[emailKey] || {};
                        const backendCompDatesForEmail = completionDatesBackend[emailKey] || {};
                        latestEnrollmentDates = backendDatesForEmail;
                        latestCompletionDates = backendCompDatesForEmail;
                    }
                    fetchProgressForAllCourses();
                    if(document.getElementById('page-curso-detalle').style.display==='block'&&currentViewedCourseId) viewCourseDetail(currentViewedCourseId);
                }
            } catch(e){ 
                console.error("Error al actualizar progreso en segundo plano:",e); 
            } finally {
                // Mostrar toast de éxito
                showSuccessToast();
            }
        }

        function calculateCourseRatings(){
            courseRatings={};
            COURSES_DATA.forEach(c=>courseRatings[c.ID]={sum:0,count:0,avg:"5.0"});
            for(const email in dbUsers){
                let u=dbUsers[email]; if(typeof u==='string'){ try{ u=JSON.parse(u); }catch(e){ u={}; } }
                if(u&&u.ratings){ for(const cid in u.ratings){ if(courseRatings[cid]){ courseRatings[cid].sum+=Number(u.ratings[cid]); courseRatings[cid].count+=1; } } }
            }
            for(const cid in courseRatings){ if(courseRatings[cid].count>0) courseRatings[cid].avg=(courseRatings[cid].sum/courseRatings[cid].count).toFixed(1); }
        }

        function updateStudentCounts(){
            COURSES_DATA.forEach(c=>studentCountsPerCourse[c.ID]=0);
            for(const email in dbUserCourses){
                let names=splitCourseNames(dbUserCourses[email]);
                names.forEach(courseName=>{
                    let nn=normalizeName(courseName);
                    let found=COURSES_DATA.find(x=>normalizeName(x.Nombre)===nn);
                    if(!found) found=COURSES_DATA.find(x=>normalizeName(x.Nombre).includes(nn)||nn.includes(normalizeName(x.Nombre)));
                    if(found) studentCountsPerCourse[found.ID]+=1;
                });
            }
        }

        async function recordVisit(visitType, itemId, itemName, details = '') {
            if (!window.currentUser || !window.currentUser.email) return;
            
            const email = window.currentUser.email.toLowerCase();
            
            try {
                const params = new URLSearchParams();
                params.append('action', 'record_visit');
                params.append('email', email);
                params.append('visitType', visitType);
                params.append('itemId', itemId);
                params.append('itemName', itemName);
                params.append('details', details);
                
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: params,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    if (!window.currentUser.visitRegistro) {
                        window.currentUser.visitRegistro = {
                            cursos: {},
                            infoPaginas: {},
                            aulas: {}
                        };
                    }
                    
                    const typeKey = visitType === 'curso' ? 'cursos' : 
                                   visitType === 'info' ? 'infoPaginas' : 
                                   visitType === 'aula' ? 'aulas' : null;
                    
                    if (typeKey) {
                        if (!window.currentUser.visitRegistro[typeKey]) {
                            window.currentUser.visitRegistro[typeKey] = {};
                        }
                        
                        if (!window.currentUser.visitRegistro[typeKey][itemId]) {
                            window.currentUser.visitRegistro[typeKey][itemId] = {
                                visitas: 0,
                                fechas: []
                            };
                        }
                        
                        window.currentUser.visitRegistro[typeKey][itemId].visitas++;
                        window.currentUser.visitRegistro[typeKey][itemId].fechas.push(result.fecha);
                        
                        localStorage.setItem('user', JSON.stringify(window.currentUser));
                    }
                }
            } catch (e) {
                console.error('Error al registrar visita:', e);
            }
        }

        async function downloadCourseMaterial(fileName,url,btnElement,courseId){
            if(!window.currentUser){ showNotif('Acceso Restringido','Debes iniciar sesión para descargar.'); openModal('authModal'); return; }
            if(!url||url.trim()=="#"||url.trim()==""){ showNotif('No Disponible','Este archivo se habilitará próximamente.','info'); return; }
            if(!Array.isArray(window.currentUser.downloadedFiles)) window.currentUser.downloadedFiles=[];
            if(!window.currentUser.downloadedFiles.includes(fileName)){
                window.currentUser.downloadedFiles.push(fileName);
                localStorage.setItem('user',JSON.stringify(window.currentUser));
                syncUserProgressToExcel();
                updateAllUI();
                if(btnElement){
                    const isExercise = btnElement.closest('#mcExercisesCard');
                    const titleSpan=btnElement.querySelector('span.font-bold.text-sm');
                    if(titleSpan && isExercise){ titleSpan.classList.remove('text-white'); titleSpan.classList.add('text-slate-400'); }
                    const subSpan=btnElement.querySelector('span.uppercase.font-bold');
                    if(subSpan){ subSpan.classList.remove('text-slate-400'); subSpan.classList.add('text-slate-500'); }
                    const countParent=btnElement.querySelector('.file-download-count')?.parentElement;
                    if(countParent){ countParent.classList.remove('text-white','text-teal-500','text-slate-400'); countParent.classList.add('text-slate-600'); }
                    const iconBox=btnElement.querySelector('.rounded-xl');
                    if(iconBox) iconBox.className=`w-12 h-12 rounded-xl bg-green-500/20 ${isExercise?'text-slate-400':'text-slate-600'} flex items-center justify-center transition-colors`;
                    const rightIcon=btnElement.lastElementChild;
                    if(rightIcon&&(rightIcon.tagName==='I'||rightIcon.tagName==='svg')){ const check=document.createElement('i'); check.className='fas fa-check-circle text-green-500 text-lg'; btnElement.replaceChild(check,rightIcon); }
                }
            }
            window.open(url,'_blank'); showToastDownload(fileName);
            if(courseId){ const fileStatId=`descarga_curso_${courseId}_${fileName.replace(/[^a-zA-Z0-9]/g,'_')}`; ping('update_stat',fileStatId); if(globalStats) globalStats[fileStatId]=(parseInt(globalStats[fileStatId])||0)+1; document.querySelectorAll(`.file-download-count[data-file-id="${fileStatId}"]`).forEach(span=>{ if(span) span.innerText=globalStats[fileStatId]; }); }
        }

        function rateCourse(courseId,rating,navigate=true){
            const activeUser = window.currentUser || (typeof currentUser !== 'undefined' ? currentUser : null) || JSON.parse(localStorage.getItem('user') || 'null');
            if(!activeUser){ openModal('authModal'); return; }
            if(!activeUser.ratings) activeUser.ratings={};
            activeUser.ratings[courseId]=rating;
            window.currentUser = activeUser;
            if (typeof currentUser !== 'undefined') currentUser = activeUser;
            localStorage.setItem('user',JSON.stringify(activeUser));
            if(activeUser.email) {
                const emailKey = activeUser.email.toLowerCase();
                let userObj = dbUsers[emailKey];
                if (typeof userObj === 'string') {
                    try { userObj = JSON.parse(userObj); } catch (e) { userObj = {}; }
                }
                userObj = userObj || {};
                userObj.ratings = activeUser.ratings;
                dbUsers[emailKey]=JSON.stringify(userObj);
            }
            syncUserProgressToExcel();
            calculateCourseRatings();
            renderMisCourses();
            const detailVisible=document.getElementById('page-curso-detalle').style.display==='block';
            if(detailVisible&&currentViewedCourseId===courseId) viewCourseDetail(courseId);
            else if(navigate) viewCourseDetail(courseId);
            showNotif('¡Valoración guardada!',`Has calificado este curso con ${rating} estrellas.`);
        }

        function toggleLike(btn){
            if(!currentUser){ openModal('authModal'); return; }
            const id=btn.dataset.id;
            if(!Array.isArray(currentUser.likedCourses)) currentUser.likedCourses=[];
            const span=btn.querySelector('.like-count');
            let currentLikes=parseInt(span.innerText)||0;
            if(currentUser.likedCourses.includes(id)){
                currentUser.likedCourses=currentUser.likedCourses.filter(c=>c!==id);
                ping('decrement_stat',`${id}_likes`);
                btn.classList.remove('liked','text-red-500');
                btn.classList.add('text-slate-400');
                span.innerText=Math.max(0, currentLikes - 1);
                if(globalStats) globalStats[`${id}_likes`]=Math.max(0, currentLikes - 1);
            } else {
                currentUser.likedCourses.push(id);
                ping('update_stat',`${id}_likes`);
                btn.classList.add('liked','text-red-500');
                btn.classList.remove('text-slate-400');
                span.innerText=currentLikes+1;
                if(globalStats) globalStats[`${id}_likes`]=currentLikes+1;
            }
            if(currentUser.email) dbUsers[currentUser.email.toLowerCase()]=JSON.stringify(currentUser);
            localStorage.setItem('user',JSON.stringify(currentUser));
            updateAllUI(); syncUserProgressToExcel();
            document.querySelectorAll(`.like-btn[data-id="${id}"]`).forEach(otherBtn=>{
                if(otherBtn!==btn){
                    if(currentUser.likedCourses.includes(id)){ otherBtn.classList.add('liked','text-red-500'); otherBtn.classList.remove('text-slate-400'); }
                    else { otherBtn.classList.remove('liked','text-red-500'); otherBtn.classList.add('text-slate-400'); }
                    const otherSpan=otherBtn.querySelector('.like-count');
                    if(otherSpan) otherSpan.innerText=span.innerText;
                }
            });
        }

                        currentUser={
