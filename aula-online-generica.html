        function showSyncIndicator(text, type = 'loading') {
            const el = document.getElementById('syncIndicator');
            if (!el) return;
            const txt = document.getElementById('syncText');
            const icon = el.querySelector('i');
            el.classList.remove('success', 'error', 'visible');
            el.classList.add('visible');
            txt.innerText = text;
            if (type === 'success') icon.className = 'fas fa-check-circle text-green-300';
            else if (type === 'error') icon.className = 'fas fa-exclamation-circle text-red-300';
            else icon.className = 'fas fa-sync-alt fa-spin text-[#2db8ce]';
            if (type !== 'loading') setTimeout(() => el.classList.remove('visible'), 2500);
        }

        function getResourceImage(moduleTitle) {
            const title = String(moduleTitle || '').toLowerCase();
            if (title.includes('grafcet')) return 'img/AA (4).gif';
            if (title.includes('logo')) return 'img/AA (11).webp';
            if (title.includes('factory')) return 'img/AA (29).webp';
            if (title.includes('giro')) return 'img/AA (36).webp';
            if (title.includes('rotórico') || title.includes('rotorico')) return 'img/AA (5).gif';
            if (title.includes('contactores')) return 'img/AA (19).webp';
            return CURRENT_COURSE.introImage || 'img/AA (7).gif';
        }

        function renderResourceCards(resources, moduleTitle) {
            if (!resources || resources.length === 0) return '<p class="text-slate-300">No hay materiales descargables para este módulo.</p>';
            const imageUrl = getResourceImage(moduleTitle);
            const cardsHtml = resources.map(resource => {
                const isManual = resource.type === 'manual';
                const badgeClass = isManual ? 'badge-manual' : 'badge-practica';
                const badgeText = isManual ? 'Manual' : 'Práctica';
                const icon = isManual ? 'book' : 'file-code';
                const subtitle = isManual ? 'Documento de apoyo y teoría' : 'Recurso práctico del módulo';
                return `
                <a href="${resource.url}" target="_blank" class="material-card" data-file-name="${resource.name}">
                    <div class="card-image-wrapper">
                        <img src="${imageUrl}" alt="${resource.name}" loading="lazy">
                        <div class="card-image-overlay"></div>
                        <span class="card-badge ${badgeClass}">${badgeText}</span>
                        <div class="card-icon-circle"><i data-lucide="${icon}" class="w-5 h-5"></i></div>
                    </div>
                    <div class="card-body">
                        <h4 class="card-title">${resource.name}</h4>
                        <p class="card-subtitle">${subtitle}</p>
                    </div>
                    <div class="card-footer">
                        <span class="download-count-badge"><i class="fas fa-download text-[10px]"></i><span>Acceder</span></span>
                        <span class="download-btn-text">Abrir <i data-lucide="arrow-right-circle" class="w-4 h-4"></i></span>
                    </div>
                </a>`;
            }).join('');
            return `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 not-prose">${cardsHtml}</div>`;
        }

            playApplauseSound: function() {
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    const ctx = new AudioCtx();
                    const now = ctx.currentTime;

                    for (let i = 0; i < 12; i += 1) {
                        const bufferSize = ctx.sampleRate * 0.05;
                        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                        const output = buffer.getChannelData(0);
                        for (let j = 0; j < bufferSize; j += 1) output[j] = (Math.random() * 2 - 1) * (1 - j / bufferSize);

                        const source = ctx.createBufferSource();
                        source.buffer = buffer;

                        const filter = ctx.createBiquadFilter();
                        filter.type = 'bandpass';
                        filter.frequency.value = 900 + (Math.random() * 800);

                        const gain = ctx.createGain();
                        gain.gain.setValueAtTime(0.0001, now + i * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.35, now + i * 0.09 + 0.01);
                        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.09 + 0.05);

                        source.connect(filter);
                        filter.connect(gain);
                        gain.connect(ctx.destination);
                        source.start(now + i * 0.09);
                        source.stop(now + i * 0.09 + 0.06);
                    }
                } catch (e) {
                    console.warn('No se pudo reproducir aplausos:', e);
                }
            },
            launchFireworks: function() {
                const canvas = document.createElement('canvas');
                canvas.style.position = 'fixed';
                canvas.style.inset = '0';
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                canvas.style.pointerEvents = 'none';
                canvas.style.zIndex = '1200';
                document.body.appendChild(canvas);

                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                resize();

                const colors = ['#00bcd4', '#22c55e', '#f43f5e', '#f59e0b', '#a78bfa', '#ffffff'];
                const particles = [];
                for (let burst = 0; burst < 6; burst += 1) {
                    const cx = (canvas.width * (0.2 + Math.random() * 0.6));
                    const cy = (canvas.height * (0.2 + Math.random() * 0.45));
                    for (let i = 0; i < 55; i += 1) {
                        const angle = (Math.PI * 2 * i) / 55;
                        const speed = 1.5 + Math.random() * 3.5;
                        particles.push({
                            x: cx,
                            y: cy,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            alpha: 1,
                            life: 75 + Math.random() * 25,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            size: 2 + Math.random() * 2.5
                        });
                    }
                }

                let frame = 0;
                const animate = () => {
                    frame += 1;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        if (p.alpha <= 0) return;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.03;
                        p.alpha -= 0.013;
                        p.life -= 1;

                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    });
                    ctx.globalAlpha = 1;

                    if (frame < 140) requestAnimationFrame(animate);
                    else canvas.remove();
                };

                requestAnimationFrame(animate);
            },

                try {
                    const user = JSON.parse(localStorage.getItem('user') || 'null');
                    const isManualCourse = CURRENT_COURSE.id >= 19;
                    const hasManualAccess = !!(user && Array.isArray(user.accessedCursos) && user.accessedCursos.includes(CURRENT_COURSE.id));
                    if (isManualCourse) {
                        if (!hasManualAccess) {
                            err.innerText = 'No has adquirido este manual. Cómpralo primero desde el catálogo.';

                    const resp = await fetch(url);
                    const data = await resp.json();
                    if (data.success) {
                        localStorage.setItem(STORAGE_KEYS.auth, JSON.stringify({ nombre: n, cedula: c, correo: em }));
                        if (data.progressData) {
                            try {
                                const p = JSON.parse(data.progressData);

                                this.quizScores = p.scores || {};
                                localStorage.setItem(STORAGE_KEYS.progress, JSON.stringify(this.progress));

                            } catch (e) {}

                        err.innerText = data.message || 'No estás inscrito.';
                        err.classList.remove('hidden');
                        if (isAuto) this.showAccessBlocked();
                        showSyncIndicator('Acceso denegado', 'error');
                    }
                } catch (error) {
                    err.innerText = 'Error de conexión.';
                    err.classList.remove('hidden');
                    showSyncIndicator('Error de conexión', 'error');
                } finally {
                    btn.disabled = false; spin.classList.add('hidden'); txt.innerText = ' Verificar Inscripción';
                }
            },

                cont.innerHTML = quiz.map((q, i) => `<div class="bg-black/20 p-5 rounded-xl border border-white/10" data-qidx="${i}"><p class="font-bold text-white mb-3">${q.q}</p><div class="space-y-2">${q.opts.map((opt, oi) => `<label class="flex items-center gap-3 cursor-pointer p-2 hover:bg-white/10 rounded quiz-option transition" data-opt-index="${oi}"><input type="radio" name="q_${i}" value="${oi}" class="accent-secondary"> ${opt}</label>`).join('')}</div><div class="correct-feedback hidden text-green-400 text-sm mt-2"></div></div>`).join('');

            gradeQuiz: function() {
                const lesson = COURSE_DATA.find(l => l.id === this.currentId);
                if (!lesson.quiz || lesson.quiz.length === 0) return;
                let score = 0, all = true, answers = [];
                lesson.quiz.forEach((q, i) => {
                    const sel = document.querySelector(`input[name="q_${i}"]:checked`);
                    if (sel) { answers[i] = parseInt(sel.value, 10); if (answers[i] === q.ans) score += Math.round(100 / lesson.quiz.length); }
                    else { all = false; answers[i] = -1; }
                });
                if (!all) { this.showModal('Atención', 'Debes responder todas las preguntas antes de enviar.', 'error'); return; }
                lesson.quiz.forEach((q, i) => {
                    const qDiv = document.querySelector(`div[data-qidx="${i}"]`);
                    const opts = qDiv.querySelectorAll('.quiz-option');
                    const fb = qDiv.querySelector('.correct-feedback');
                    opts.forEach(opt => {
                        opt.classList.remove('correct', 'incorrect');
                        const idx = parseInt(opt.dataset.optIndex, 10);
                        if (idx === q.ans) opt.classList.add('correct');
                        else if (answers[i] === idx) opt.classList.add('incorrect');
                    });
                    fb.innerHTML = `✅ ${q.opts[q.ans]}`;
                    fb.classList.remove('hidden');
                });
                score = Math.min(score, 100);
                const best = this.quizScores[this.currentId] || 0;
                if (score > best) { this.quizScores[this.currentId] = score; localStorage.setItem(STORAGE_KEYS.scores, JSON.stringify(this.quizScores)); }
                const resDiv = document.getElementById('quiz-result');
                resDiv.classList.remove('hidden');
                if (score >= 70) {
                    resDiv.innerHTML = `<span class="text-green-400 text-xl">Aprobado con ${score}%. Tu mejor nota quedó guardada.</span>`;
                    if (!this.progress.includes(this.currentId)) {
                        this.progress.push(this.currentId);
                        this.progress.sort((a, b) => a - b);
                        localStorage.setItem(STORAGE_KEYS.progress, JSON.stringify(this.progress));
                        this.syncProgress();
                        if (this.progress.length === COURSE_DATA.length) {
                            this.saveCompletionToSheet();
                            this.playApplauseSound();
                            this.launchFireworks();
                            setTimeout(() => { this.showModal('🏆 ¡Curso Finalizado!', 'Has completado todos los módulos con éxito. Puedes descargar tu certificado.', 'medal'); this.showDashboard(); }, 1000);
                        } else {
                            this.showAchievementOverlay(this.currentId, score);
                        }
                        this.renderSidebar();
                        this.updateCompleteButton();
                    } else {
                        this.showAchievementOverlay(this.currentId, score);
                        this.syncProgress();
                    }
                } else {
                    resDiv.innerHTML = `<span class="text-red-400 text-xl">Obtuviste ${score}%. Necesitas 70% para aprobar.</span>`;
                    this.showEncouragementOverlay(this.currentId, score);
                    this.syncProgress();
                }
            },
            resetQuiz: function() {
                document.querySelectorAll('#quiz-questions input[type="radio"]').forEach(input => input.checked = false);
                document.querySelectorAll('.quiz-option').forEach(opt => opt.classList.remove('correct', 'incorrect'));
                document.querySelectorAll('.correct-feedback').forEach(fb => fb.classList.add('hidden'));
                document.getElementById('quiz-result').classList.add('hidden');
            },
            saveCompletionToSheet: async function() {
                const auth = JSON.parse(localStorage.getItem(STORAGE_KEYS.auth) || 'null');
                if (!auth?.correo) return;
                try {
                    const formData = new URLSearchParams();
                    formData.append('action', 'save_course_completion');
                    formData.append('email', auth.correo);
                    formData.append('courseName', CURRENT_COURSE.name);
                    formData.append('completionDate', new Date().toISOString());
                    await fetch(this.scriptUrl, { method: 'POST', mode: 'no-cors', body: formData, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                } catch (e) { console.error('Error al guardar finalización:', e); }
            },
            syncProgress: function() {
                const auth = JSON.parse(localStorage.getItem(STORAGE_KEYS.auth) || 'null');
                if (!auth) return;
                const data = JSON.stringify({ progress: this.progress, scores: this.quizScores });
                fetch(`${this.scriptUrl}?action=save_course_progress&correo=${encodeURIComponent(auth.correo)}&cedula=${encodeURIComponent(auth.cedula)}&curso=${encodeURIComponent(CURRENT_COURSE.name)}&data=${encodeURIComponent(data)}`, { method: 'GET', mode: 'no-cors' }).catch(e => console.error('Sync Error:', e));
            },
            syncUserData: async function() {
                const user = JSON.parse(localStorage.getItem('user') || 'null');
                if (!user?.email) return;
                try {
                    const formData = new URLSearchParams();
                    formData.append('action', 'update_user');
                    formData.append('email', user.email.toLowerCase());
                    formData.append('userData', JSON.stringify(user));
                    await fetch(this.scriptUrl, { method: 'POST', mode: 'no-cors', body: formData, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } });
                } catch (e) {}
            },
            updateCompleteButton: function() {
                const lesson = COURSE_DATA.find(l => l.id === this.currentId);
                const hasQuiz = lesson?.quiz && lesson.quiz.length > 0;
                document.getElementById('btn-complete').disabled = hasQuiz && !this.progress.includes(this.currentId);
            },
            completeLesson: function() {
                if (this.currentId === 0) {
                    if (!this.progress.includes(0)) { this.progress.push(0); localStorage.setItem(STORAGE_KEYS.progress, JSON.stringify(this.progress)); this.syncProgress(); }
                    this.loadLesson(1);
                } else {
                    const nextId = this.currentId + 1;
                    if (nextId < COURSE_DATA.length) this.loadLesson(nextId); else this.showDashboard();
                }
            },
            switchTab: function(tabId) {
                ['content', 'resources', 'quiz'].forEach(tab => {
                    document.getElementById(`panel-${tab}`).classList.toggle('hidden', tab !== tabId);
                    document.getElementById(`tab-${tab}`).className = tab === tabId ? 'pb-2 font-bold border-b-2 border-secondary text-secondary px-2' : 'pb-2 font-bold border-b-2 border-transparent text-slate-400 hover:text-white px-2';
                });
                document.getElementById('btn-complete').parentElement.classList.toggle('hidden', tabId !== 'content');
            },
            showModal: function(title, msg, type) {
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-msg').innerText = msg;
                let icon = '✅'; if (type === 'error') icon = '❌'; else if (type === 'medal') icon = '<i class="fas fa-trophy text-yellow-400 animate-bounce"></i>';
                document.getElementById('modal-icon').innerHTML = icon;
                document.getElementById('modal-feedback').classList.remove('hidden');
            },
            showAccessBlocked: function() {
                const container = document.querySelector('#login-screen > div');
                container.innerHTML = `<div class="text-center"><div class="text-6xl text-red-500 mb-6"><i class="fas fa-lock"></i></div><h2 class="text-2xl font-bold text-white mb-4">ACCESO RESTRINGIDO</h2><p class="text-slate-300 text-sm mb-8 leading-relaxed">No estás inscrito en ${CURRENT_COURSE.name}. Para acceder a esta aula virtual debes adquirir el curso primero en nuestro catálogo.</p><div class="space-y-4"><button onclick="window.location.href='catalogo.html'" class="w-full bg-primary text-white py-3 rounded-lg font-bold shadow-lg hover:brightness-110 transition">Ver Catálogo de Cursos</button><button onclick="localStorage.removeItem('user'); location.reload();" class="w-full bg-white/10 text-slate-300 py-2 rounded-lg text-xs font-bold hover:bg-white/20 transition">Ingresar con otra cuenta</button></div></div>`;
            },
            logout: function() {
                if (confirm('¿Deseas cerrar sesión y salir del aula virtual?')) {
                    this.clearLocalData();
                    window.location.href = 'mis-cursos.html';
                }
            }
        };

        window.onload = () => { app.init(); if (window.lucide) lucide.createIcons(); };
    </script>
</body>
</html>
